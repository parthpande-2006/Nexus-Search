version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: nexus_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nexus_search
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: nexus_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/nexus_search
      - REDIS_URL=redis://redis:6379/0
      - INDEX_DIR=/app/data_indices
      - LLM_PROVIDER=mock
    depends_on:
      - db
      - redis
    volumes:
      - shared_indices:/app/data_indices

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: nexus_worker
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/nexus_search
      - REDIS_URL=redis://redis:6379/0
      - INDEX_DIR=/app/data_indices
      - LLM_PROVIDER=mock
    depends_on:
      - db
      - redis
    volumes:
      - shared_indices:/app/data_indices

  prometheus:
    image: prom/prometheus:latest
    container_name: nexus_prometheus
    restart: always
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - api

volumes:
  postgres_data:
  shared_indices:
